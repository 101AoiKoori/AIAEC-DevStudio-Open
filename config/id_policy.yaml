version: 1
status: active
note: 编号、任务口径与计数单位的唯一编辑源；生成 docs/ID_AND_COUNT_POLICY.md，检查用 python lab/scripts/contracts/id_policy.py --check。

requirement_ids:
  canonical:
    family: TASK-RNN
    pattern: '^[A-Z][A-Z0-9_]*-R[0-9]{2,3}$'
    owner: config/perception_tasks.json
    validator: lab/scripts/contracts/sync_docs.py
    description: 新需求项统一使用任务 ID 加 -R 和两位或三位序号；同一 ID 保持稳定含义。
  frozen_aliases:
    semantic:
    - TRAFFIC_LIGHT-METHOD
    - PERSON-COUNT
    - PERSON-TARGET-SCOPE
    - PERSON-MIN-SCALE
    - PERSON-DATASET-READY
    - PERSON-TRAINING-V3
    - SIGN-DATASET-READY
    - SIGN-TRAINING-V3
    - WASTE_BIN-SCOPE
    - WASTE_BIN-DATASET-READY
    - WASTE_BIN-TRAINING-V3
    - FIRE-DATASET-READY
    - FIRE-TRAINING-V3
    - THERMAL-FACT
    - THERMAL-THRESHOLD
    - THERMAL-OBSERVE
    - METER-DATASET-READY
    - METER-TRAINING-V3
    - PLATE-DATASET-SCOPE
    - PLATE-TRAINING-V3
    - E_BIKE-DATASET-READY
    - E_BIKE-TRAINING-V3
    legacy_numeric:
    - TRAFFIC_LIGHT-1
    - PERSON-1
    - PERSON-2
    - SIGN-1
    - WASTE_BIN-1
    - WASTE_BIN-2
    - WASTE_BIN-3
    - FIRE-1
    - FIRE-2
    - METER-1
    - PLATE-1
    - PLATE-2
    - PLATE-3
    - E_BIKE-1
    - E_BIKE-2

pairing_ids:
  canonical_requirements: PAIR-RNN
  canonical_rules: PAIR-VNN
  frozen:
    requirements: R1-R12
    rules: V1-V12
    diagnostics: BSL001-BSL030
  reserved_diagnostics:
  - BSL010
  - BSL015
  - BSL024
  - BSL027
  - BSL028
  - BSL029
  notes:
  - 新增配对设计需求使用 PAIR-RNN，新增校核规则使用 PAIR-VNN。
  - 现有 R1-R12、V1-V12 和 BSL 编号冻结；不再新增裸 R、V 或 BSL 编号。
  - source_pairing.py 是配对单一 checker；source_ledger 的 BSL 只作派生报告诊断，不是第二套 gate。
  - V11 按实际批次核对选中父组的 split、同源复用及评估范围。

task_scopes:
  sources:
    perception: config/perception_tasks.json
    dataset: config/workspace_layout.yaml
    model_packages: config/task_targets.yaml
    model_packages_extra:
    - plate
  mapping:
    traffic_light: []
    person:
    - person
    sign:
    - sign
    waste_bin:
    - waste_bin_state
    - waste_sticker
    fire:
    - fire
    - building_name_paper
    thermal: []
    meter:
    - meter
    plate: []
    e_bike:
    - e_bike
  notes:
  - 识别任务是 config/perception_tasks.json 的九项，包含红绿灯、热异常和车牌，不把楼名纸条、垃圾贴纸拆成独立识别任务。
  - 数据任务是 V4 需要自建数据的八项；fire 拆为火焰贴纸与楼名纸条，waste_bin 拆为桶开闭与垃圾贴纸。
  - 模型包是八个数据任务模型加车牌省赛模型；红绿灯使用 HSV/ROI，热异常不设 YOLO 包，均不计入九个模型包。

count_units:
  image:
    definition: 按报表范围计入库源图或最终导出图。同一原帧的原件、别名和内容相同的工作副本在身份已核实后共享图像身份；裁切、画面变换和重渲染沿各自图像身份追溯父来源。任务使用量按任务分别计。
    authority: 入库图查逐图持久数据库与来源证据，导出图查对应批次清单
  instance:
    definition: 图像中的一个任务目标；同一图可有多个任务及多个实例。对应同一物体的任务标注引用共享 object_id，任务目标和标签层各自保留。同一目标的检测框、关键点、文字等层可关联至同一实例；标签完整性按任务、标签层及作用域分别核对。
    authority: 逐图任务实例记录及其引用的任务标签与作用域，目标定义见 config/task_targets.yaml
  parent_group:
    definition: 按用途和来源证据归组的父素材；一个组可对应源视频、场次、物理物料或 Blender 母场景。同一父源的帧、裁剪、增强和多机位渲染不增加父组；独立采集需要另有场次证据。
    authority: datasets/scripts/<任务>/config/source.yaml 的 pairing
  state:
    definition: 一个可编辑场景、渲染状态或组合状态；不等于最终图片张数，也不等于父组数。
    authority: 任务 render_plan.json、production_plan.json 或 source.yaml
  plan_budget:
    definition: 计划声明的目标产量或预算；可能尚未生产，不能当作实际产量。
    authority: datasets/scripts/<任务>/config/*plan*.json 的 budget
  plan_capacity:
    definition: 现有计划 strata 的 max_count 之和；表示当前计划结构最多能承载的图片数，不是父源容量。
    authority: datasets/scripts/<任务>/config/*.json
  quota:
    definition: 计划为任务或状态组合分配的产出张数。用途资格按图像身份、任务和角色证据判断，split 记录实际分配。合格未分配现货可进入计划选源，实际可排张数按可行组合计。已入库资格、已分配库存、计划配额与导出产量分别报告。
    authority: 资格查逐图持久数据库，配额查 config/full_train_allocation.yaml 或实际执行计划

annotation_layers:
  independent_layers:
  - id: source_available
    definition: 已纳入指定来源范围、文件可访问且来源关系可追溯的图片或实例。
    authority: 逐图来源身份及父来源记录、原始清单和实际文件核验
  - id: annotated
    definition: 已存在明确标签载荷的图片或实例；标签文件、JSONL 记录、polygon 或 mask 需能核对到当前图片，单纯清单声明不单独提升本层。
    authority: 逐图任务标签引用及其原始标签、JSONL、polygon 与掩膜文件
  - id: candidate
    definition: 由模型、图像处理或程序生成的候选框、候选实例或候选审查记录；候选不等于人工确认。
    authority: 任务候选清单、review selection 与候选标注记录
  - id: auto_validated
    definition: 已通过明确程序化或自动校核的图片、实例或记录；只填自动验证层，不填人工确认层。
    authority: 自动检查指标、reason code 与代码版本
  - id: human_confirmed
    definition: 当前记录所需人工语义确认以及适用的人工框或掩膜确认均已完成并留下确认人证据的图片或实例。
    authority: 人工复核记录、确认人、确认时间和逐项确认结果
  - id: training_admitted
    definition: 已由当前任务入口用于指定训练集合的图片或实例。入库后满足某用途的图可进入可分配池，训练准入按实际选用和消费记录认定。
    authority: 训练准入清单、实际执行计划与任务入口记录
  count_rule: 六层是相互独立的计数视图，同一记录可以同时属于多层；不得把它们相加当总量，也不得用一层计数替代另一层。
  unit_rule: 报告写明计数单位、任务范围和适用批次。并列比较六层和 pending 时使用同一口径；单项查询报告相关计数与单位。
  pending:
    definition: 当前用途所需的某项证据待补的状态。unknown 表示具体字段未判明，其影响以该任务、角色、split 和证据范围为限。
    rule: 按待补字段、范围和原因，从入库端复用原帧、任务模型、规则、几何和已有标签自动补证；机器证据满足用途条件即可写回当前依据并重算对应资格。选源和生成直接消费有效资格。空的 accepted_by 只描述人工确认层。
  confirmation_dimensions:
    semantic:
      definition: 确认对象类别、存在性、任务归属和语义是否正确的独立人工维度。
      rule: 程序化接受只支持 auto_validated，不能填充本维度。
    box:
      definition: 确认目标框的位置、范围和数量是否正确的独立人工维度。
      rule: 框与语义各自记录确认依据。已安排人工框复核但尚未确认时，人工框状态记 pending。
    mask:
      definition: 确认掩膜、多边形或实例覆盖是否正确的独立人工维度；不要求每个任务都存在掩膜。
      rule: 掩膜按实际核查范围记录。已安排人工掩膜复核但尚未确认时，人工掩膜状态记 pending。
    separation_rule: 人工语义、人工框和人工掩膜分别计数；human_confirmed 只有在当前记录所需维度全部完成时才成立。
  negative_states:
    values:
    - rejected
    - excluded
    evidence_required: 只有存在实际失败证据时才可记 rejected 或 excluded；证据应能指向失败的检查、标签、来源、规则或人工判断。
    rule: 证据未明的字段按用途记录 pending 或 unknown。机器已判明的完整正例或负例按对应标签状态记录；存在明确失败依据时记录对应拒绝原因。
  summary_contract:
    required_layers:
    - source_available
    - annotated
    - candidate
    - auto_validated
    - human_confirmed
    - training_admitted
    pending_counter: pending
    required_confirmation_dimensions:
    - semantic
    - box
    - mask
    rule: 已安排人工确认的维度按实际状态报告。未安排时写“不适用”。导出图片与标签文件的配对数、直接实拍监督图片数及训练准入数按各自证据报告。实拍背景合成计入合成产量，标签内容按任务和覆盖范围判断。

authorities:
- fact: 识别任务清单
  source: config/perception_tasks.json
- fact: 数据任务与目录
  source: config/workspace_layout.yaml
- fact: 训练目标
  source: config/task_targets.yaml
- fact: 组合轴
  source: config/combination_axes.yaml
- fact: 全量 train 规模与来源组成
  source: config/full_train_allocation.yaml 与 datasets/scripts/<任务>/config/dataset.yaml
- fact: 父子源与 split
  source: datasets/scripts/<任务>/config/source.yaml 的 pairing
- fact: 当前逐图入库结论及按用途计入配额的资格
  source: datasets/annotated/common/sources/frame_environment.sqlite3 及其引用的来源、任务标签与观测证据；当前已接线范围见 docs/DATASET_PRODUCTION.md
- fact: 可执行计划
  source: datasets/scripts/<任务>/config/*.json
- fact: 对象类别、所有者与权威
  source: config/workspace_ontology.yaml

rules:
- 新需求项统一使用 TASK-RNN；不再新增语义 ID 或裸数字 ID。
- 语义 ID 和裸数字 ID 是冻结别名；保留原 ID 和原含义，修改文字不重新编号。
- 新增配对设计需求用 PAIR-RNN，新增校核规则用 PAIR-VNN；现有 R1-R12、V1-V12、BSL 编号冻结。
- 任何 ID 改动先更新引用；跨文档引用必须指向已登记 ID 或生成锚点。
- 计数必须写单位；图片、实例、父组、状态、预算、容量、配额不得互相替代。
- 库存按逐图库中该任务与角色下证据有效的 eligible 记录计。unassigned 单列为可分配现货，按父来源安排后计入目标 split；分集查询为 0 表示该任务、角色与 split 暂无已分配的有效记录。逐图库存按 frame_id 去重；同一任务和 split 的直接实拍合并 direct_target 正例与实拍来源的 empty_negative，按可核的 capture_identity 跨角色去重。
- 直接实拍监督统计按原始相机画面及完整任务标签计算，内容一致的工作副本沿用原图身份；实拍背景生成的样本计入合成产量。
- 按接收任务的目标定义检查整帧，证实无识别范围内的目标后计为 empty_negative。任务目录用于发现候选。crop 或 surface 的负标注只支持对应区域。空间观测缺项或不可放置时单独判断合成背景资格。
- 算法更新后在入库端批量重算受影响的机器观测，按新版本更新所涉用途的可分配资格；人工内容与历史批次的证据版本及回执保留。
- 计划数量不是实际产量，设计比例不是实测分布，未知不得写成零或成功。
- 标注事实按 source_available、annotated、candidate、auto_validated、human_confirmed、training_admitted 六个独立层计数；全流程盘点同时展示六层、pending 和适用的人工语义/框/掩膜确认计数。
- pending 附具体用途与证据缺口；同一范围得到充分机器证据时可直接更新判定和用途。
- 自动或程序化验证只填 auto_validated，不填 human_confirmed；人工语义确认与人工框、掩膜确认分开记录。
- rejected 和 excluded 只有在存在实际失败证据时使用，不得用“人工接受为 0”代替“标注或标签为 0”。

section_numbering:
  rule: 长设计或流程文档可用编号 H2；生成文档和短说明不强制编号；跨文档引用使用锚点，不写裸“第 N 节”。
