      - {id: no_paper_multi_building, target: no_paper, axes: {building_count: multi}, quota: 500}
      - {id: paper_single_name_single_building, target: paper, axes: {building_count: single, name: single}, quota: 600}
      - {id: paper_single_name_multi_building, target: paper, axes: {building_count: multi, name: single}, quota: 600}
      - {id: paper_multiple_names_single_building, target: paper, axes: {building_count: single, name: multiple}, quota: 400}
      - {id: paper_multiple_names_multi_building, target: paper, axes: {building_count: multi, name: multiple}, quota: 400}
    notes: 下列 source_mix 和 groups 保留早期设计参考，不作为当前执行配额；当前按 full_recipe 编排七种楼数组合及全部 26 种纸条开关状态，监督为 paper 检测。
