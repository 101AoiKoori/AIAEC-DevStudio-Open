    allocation_recipe: datasets/scripts/building_name_paper/config/full_recipe.json
    source_mix_status: historical_reference
    group_quota_status: historical_reference
    source_mix: {direct_real: 0.20, real_composite: 0.40, blender: 0.40}
    blender_cap: 0.40
