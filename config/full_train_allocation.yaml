    notes: Train2500、Val300、Test300按任务full_dataset配方生成。目标覆盖完整、截断/遮挡、杆底座及普通杆对照；实拍按现货加入，前景共享同一牌具视频，Val为受控诊断，Test停车视频已有历史接触，作回归。
