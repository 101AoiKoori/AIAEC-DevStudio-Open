    total: 2500
    source_mix: {direct_real: 0.0036, real_composite: 0.6764, blender: 0.32}
    blender_cap: 0.40
    quota_basis: 计图片、可辨牌具框及经确认的空场／普通立杆硬负。单列可辨截断，普通立杆配额来自同图牌具缺席证据。
