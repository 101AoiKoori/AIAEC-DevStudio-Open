# 八任务全量 train 计划设计草案。
# 这是设计草案的配额快照。实际批次以任务入口消费的计划与导出清单为准。
# groups.axes 沿用草案表结构，其中 count/name 属于画面覆盖，needle 属于目标取值；
# 编译时分别读取 config/task_targets.yaml 的标注口径与 config/combination_axes.yaml 的对照设计。
# 生成设计文档：python lab/scripts/contracts/full_plan_design.py --write
# 检查：python lab/scripts/contracts/full_plan_design.py --check
#
# 共同假设：
# - 图片数为 train 目标。按实际可行容量及父组安排编制可运行批次，记录产量与缺额。
# - 各任务 source_mix 为直接实拍、实拍背景合成、Blender 的设计参考。
#   blender_cap 沿用字段名，记录 Blender 参考份额，实际比例随可行状态调整。
# - 组配额是设计分配，不冒充实测分布、模型效果或已完成数据。
# - waste_sticker 的 0/30/70 是历史设计参考；当前将可用直接实拍与合成共同编批，不固定比例。
version: 1
status: design_draft
allocation_policy:
  status: design_guidance
  unit: final_image
  database: datasets/annotated/common/sources/frame_environment.sqlite3
  eligible_query: datasets.scripts.common.frame_environment.query_frames
  blender_inventory: datasets/README.md#共享-blender-底图选源
  eligibility_key: [frame_id, task, role]
  allocation_key: [frame_id, task, role, split]
  identity_key: capture_identity
  parent_share_reference: 0.8
  split_use: 已合格且未分配的素材是待分派现货，编批时按实际用途落实 split 并核对明确保留的用途。同源派生的不同布局可用于训练或诊断 val／test，按实际接触报告。独立实拍评估另核场次与父来源。
  quota_roles:
    direct_target: 含本任务目标且正标签完整的直接实拍，按捕获身份去重。
    empty_negative: 按接收任务定义检查整帧，确认无识别范围内目标后可用于空标签监督。空间不可用或待补证时仍可采用。按来源证据分开计直接实拍负例与背景派生负例。
    composite_background: 常规底图的主体不属于接收任务目标，须有可放或可贴空间。范围内的非主体目标有完整标签并随输出变换，范围外物体仍按实际占位和遮挡处理。其他任务目录用于优先发现候选，主体与标签由画面判断。
  source_capacity: 用途资格按任务和角色证据计算，split 记录批次分配。eligible 且 unassigned 的现货可先纳入候选计划，按父来源分配后计入该 split。每格用 capture_identity 去重，帧版本和物理父组并列计。最终合成容量取实际可行状态数。
  source_mix: 来源比例和 Blender 份额供设计与报告。合格的共享底图、Blender 渲染和实拍分支各自推进，以当批可行状态分配预算，记录实际份额、产量和仍缺范围。
  selected_direct: 从 direct_target 取正例，从 empty_negative 取来源证据支持直接实拍的负例，按原始捕获身份去重；裁切、增强和复制保留同一父来源，按生成方式另记。
  feasible_states: 用本次放置范围和任务图签匹配目标与背景，提交可行状态及容量。已有证据支持用途的帧在入库端重算资格，其他缺项定向补判，可行批次并行编排。
  parent_scope: 按 source.yaml 核对明确保留的父组用途。原件、别名、同视频和母场景派生继承父组。80% 用于提示父组集中度，记录实际份额和跨 split 的复用关系。固定类别图案或模型作为可复用资产单独记来源。
  accounting: 目标源、底图和可行状态分别计容量。场景对照可共享图片，同一任务与 split 的最终图片总量只计一次。独立报告计划预算、导出图片、目标实例、近重复组、物理父组和待补来源。
  source_gaps: 先生成已可行的组合。只对受影响的用途记录任务、角色、split、父组和缺少的证据，复用已有机器观测补判。合成预算按成图计，可用同一合格底图编排不同有效布局。
tasks:
  person:
    total: 3000
    source_mix: {direct_real: 0.30, real_composite: 0.40, blender: 0.30}
    blender_cap: 0.40
    quota_basis: 计完整图片和两类框。纯空受已核空场底图容量约束；单人、仅白背、正背同框从可比布局取样，两类分别核对无遮挡、直立车辆遮挡和倒伏车辆遮挡。
    startup_batch: 使用已导出的 3,000／300／300 批次作基线。后续按实际失败选单人、仅白背、正背同框及两类人物的无遮挡／车挡对照，优先复用合格底图换身份与有效脚点。
    groups:
      - {id: empty_scene, target: empty, axes: {vehicle_occlusion: none}, quota: 300}
      - {id: community_none, target: community, axes: {vehicle_occlusion: none}, quota: 975}
      - {id: noncommunity_none, target: noncommunity, axes: {vehicle_occlusion: none}, quota: 975}
      - {id: community_upright, target: community, axes: {vehicle_occlusion: upright}, quota: 188}
      - {id: noncommunity_upright, target: noncommunity, axes: {vehicle_occlusion: upright}, quota: 187}
      - {id: community_fallen, target: community, axes: {vehicle_occlusion: fallen}, quota: 187}
      - {id: noncommunity_fallen, target: noncommunity, axes: {vehicle_occlusion: fallen}, quota: 188}
    notes: 空场 300；非空 2,700 中 single/multi 各约 1,350；电动车遮挡共 750，直立/倒伏各 375，两类身份各约一半。
  e_bike:
    total: 4000
    source_mix: {direct_real: 0.30, real_composite: 0.40, blender: 0.30}
    blender_cap: 0.40
    quota_basis: 计完整图片和逐车直立／倒伏框。同底图比较零／直立／倒伏；街道、停车区、两类遮挡用有场景证据的格。
    startup_batch: 当前子批预算与状态从电动车 production_plan.json 读取，实际图签从当前小样清单读取。追加批次先在合格底图上换脚点、视面和尺度并交叉两姿态，再单列能通过布局核对的多车和遮挡状态。
    # 400 张空场独立于姿态，正例预算为直立、倒伏各 1,800 张。
    groups:
      - {id: empty_street, target: empty, axes: {count: empty, location: street}, quota: 200}
      - {id: empty_parking, target: empty, axes: {count: empty, location: parking}, quota: 200}
      - {id: upright_single_street, target: upright, axes: {count: single, location: street}, quota: 400}
      - {id: upright_single_parking, target: upright, axes: {count: single, location: parking}, quota: 400}
      - {id: upright_multi_street, target: upright, axes: {count: multi, location: street}, quota: 500}
      - {id: upright_multi_parking, target: upright, axes: {count: multi, location: parking}, quota: 500}
      - {id: fallen_single_street, target: fallen, axes: {count: single, location: street}, quota: 400}
      - {id: fallen_single_parking, target: fallen, axes: {count: single, location: parking}, quota: 400}
      - {id: fallen_multi_street, target: fallen, axes: {count: multi, location: street}, quota: 500}
      - {id: fallen_multi_parking, target: fallen, axes: {count: multi, location: parking}, quota: 500}
    notes: 直立与倒伏正例各 1,800；零／单／多车约 400／1,600／2,000。街道和停车区各半是抽样参考，先安排已有可行格。
  fire:
    total: 3000
    source_mix: {direct_real: 0.007, real_composite: 0.593, blender: 0.40}
    blender_cap: 0.40
    quota_basis: 计图片和按楼归属的有效贴纸实例。每楼零需要完整观察范围；裁区无贴只支持该裁区的空样本或贴图。
