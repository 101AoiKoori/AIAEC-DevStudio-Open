      - {id: facade_C_single, target: fire_sticker, axes: {facade: C, count: single}, quota: 400}
      - {id: facade_C_multi, target: fire_sticker, axes: {facade: C, count: multi}, quota: 400}
    notes: 零/单/多贴约 600/1,200/1,200；各楼面组为设计参考。当前按真实父来源及可行墙面执行，Blender 配额包含实景混合合成，实际逐楼计数以可见实例归属为准。
