          role: nuisance
          value_source: axes.reading_sampling
        context.tone:
          object: context
          role: nuisance
          value_source: axes.saturation
        context.exposure:
          object: context
          role: nuisance
          value_source: axes.exposure
        context.light_relation:
          object: context
          role: nuisance
          value_source: axes.light_relation
        scene.background:
          object: scene
          role: nuisance
          value_source: axes.background
        target.presence:
