            vary:
            - context.glare
            variation: single
          unresolved:
          - 硬负例与正例的对照关系尚未结构化，按 pairs 原文理解。
          constraints:
          - kind: evidence_rule
            rule: record_each_keypoint_visibility
            source_field: check
          evidence_links:
          - kind: historical_observation
            task: meter
            cross_id: background_glare
          - kind: required_observation
            dimensions:
            - context.glare
            - context.hard_negative
            - scene.background
            - scene.camera
            - target.needle
            - target.presence
