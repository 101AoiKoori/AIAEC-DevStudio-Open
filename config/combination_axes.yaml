          object: scene
          role: nuisance
          value_source: axes.distance
        scene.incidence_angle:
          object: scene
          role: nuisance
          value_source: unknown
        scene.camera:
          object: scene
          role: nuisance
          value_source: unknown
        scene.placement:
          object: scene
          role: nuisance
          value_source: axes.placement
