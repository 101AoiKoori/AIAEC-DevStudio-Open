            - scene.camera
            - scene.distance
            - target.mount_angle
            - target.needle
            - scene.incidence_angle
      - id: background_glare
        purpose: 背景和局部高光不能决定是否有表或某个点是否可见。
        pairs: 同背景有表／无表，另选相似圆形物作硬负；同读数保持机位配局部高光与无高光。
        check: 核对框与各点可见性并回链 foreground_annotation；高光、读数和安装姿态都应有各自证据。
        structured:
