            source_field: check
          evidence_links:
          - kind: required_observation
            task: meter
            cross_id: material_background_photometry
            dimensions: [target.face_material, scene.background, context.tone, scene.camera, target.needle]
      - id: reading_view_light
        purpose: 表针读数不能从机距、俯视程度或光色猜出。
        pairs: 同一针位保持安装倾角，分别换机距与入射角；同机位换针位并独立轮换色调。
        check: 用相机到盘心距离、表盘法向入射角及针位作联合表并核对 8 点标签；ground_angle_deg 只记录安装倾角。
        structured:
          completeness: partial
          contrasts:
          - hold:
            - target.needle
            - target.mount_angle
            vary:
            - scene.distance
            - scene.incidence_angle
            variation: unresolved
          - hold:
            - scene.camera
            vary:
            - target.needle
            - context.tone
