          role: target
          value_source: targets.presence
        context.hard_negative:
          object: context
          role: nuisance
          value_source: unknown
        context.glare:
          object: context
          role: nuisance
          value_source: axes.glare
    placement: 站房支撑位置或表盘替换区及坐标尺寸；针位、机位和反光依各自证据记录。
    axes:
      background: dynamic
      distance: dynamic
      view: [frontal, oblique]
      glare: [none, present]
      face_material: [white, colored]
      reading_sampling: [grid_anchor, continuous]
      placement: [fixed_contact, randomized]
      degradation: [clean, soft_blur, jpeg, sensor_noise, blur_jpeg]
      saturation: [native, low, very_low]
      exposure: [dark, normal, bright]
      light_relation: [foreground_darker, matched, foreground_brighter]
    crosses:
      - id: material_background_photometry
        purpose: 白盘和彩盘不能与背景、饱和度或明暗关系绑定。
        pairs: 同机位同双针同底图成对白盘和彩盘；独立轮换饱和度、整体曝光及前景相对背景亮度。
        check: 从 parameters 和 photometry 联合统计三轴，逐点坐标随统一缩放平移；RGB 增强保留 alpha，逐点记录可见性。
        structured:
          completeness: partial
          contrasts:
          - hold: [target.needle, scene.camera, scene.background]
