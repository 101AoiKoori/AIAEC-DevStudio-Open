            variation: single
          - hold: [target.needle, scene.camera]
            vary: [scene.background]
            variation: single
          - hold: [target.needle, scene.camera, scene.background]
            vary: [context.tone]
            variation: single
          - hold: [target.needle, scene.camera, scene.background]
            vary: [context.exposure]
            variation: single
          - hold: [target.needle, scene.camera, scene.background]
            vary: [context.light_relation]
            variation: single
          constraints:
