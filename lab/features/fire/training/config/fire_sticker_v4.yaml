- 来源门控和语义审核尚未完成；合成测试候选不是独立实拍，正式测试须选模并冻结。
- 按来源、片段、主体及状态预选并审核数据；同源和物理素材复用分别报告。
- 阶段参数按实际数据量、有效更新数与开发曲线复核；业务分层选模和最终测试另行执行。
- 车载参考 640×480；制作数据不超过 720p。统计源图有效目标像素，放大不增加真实细节。
- 另加入 216 张按既有背景审核和实例框回算的干扰候选；场地、视频、楼宇模型及暗色变体复用，非独立采集。
- 五批 677 张候选的背景审核记录、生成器实例掩膜与火焰标签已自动对应；同源视频、物料及帧 008185 的邻近关系保留。
- 三批共 560 张真实楼面合成与色调候选按来源、纸张变换和框核对；指定面身份、物理尺寸未实测，同源复用保留。
- 既有 1434 张候选逐批按已记录的背景审核、实例、楼面几何、实拍标注或旧图裁切回算并接入；标签为 AI 候选审核，场地与素材复用，按来源记录。
