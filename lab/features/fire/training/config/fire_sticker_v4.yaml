source_notes:
- 当前训练输入、实际覆盖和来源接触见数据入口同目录 workspace_sources.json 及分集清单。
- 首轮学习方案及当前制作状态见 datasets/scripts/fire/config/first_round_learning.yaml 和实际 workspace_sources.json；有无贴纸与干扰物同框分别记录，不从空标签推断干扰类型。
- 150轮上限，前120轮不累计早停耐心，之后15轮无至少0.001的验证mAP50-95改善则停；严格最高验证分数仍逐轮保存。单次36000秒硬时限由launcher维护，超时不记为完成。
- 正例、硬负例与同框干扰使用同一增强；保留主要颜色，轻度几何变化避免继续缩小8-16像素目标。Test仅在选模冻结后使用，不用于早停或阈值选择。
