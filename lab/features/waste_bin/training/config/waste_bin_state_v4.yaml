schema_version: 3
task_id: waste_bin
model_key: waste_bin_state
version: v4
task: detect
data: datasets/exports/waste_bin_state/data.yaml
model: models/weights/yolo_v8/yolov8n.pt
output_root: runs/waste_bin_state
description: 使用完整垃圾桶开闭数据，从通用 COCO yolov8n 预训练权重训练整桶开闭检测。
imgsz: 640
epochs: 120
batch: 16
workers: 0
patience: 0
seed: 42
device: '0'
optimizer: AdamW
lr0: 0.001
lrf: 0.08
momentum: 0.9
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true
close_mosaic: 0
amp: false
deterministic: true
max_det: 100
diagnostic_conf: 0.25
match_iou: 0.5
nms_iou: 0.7
preview_limit: 48
training_policy:
  mode: fixed_validation
  save_period: 5
evaluate_after_training: true
augment:
  degrees: 3.0
  translate: 0.05
  scale: 0.05
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.12
source_notes:
- 当前正式导出的来源、空间与评价范围见同目录 manifest.json 和对应 split 清单。
- 整桶框监督 open、closed 两类；颜色和机位仅用于训练后的分组诊断，不参与损失或选模。
- 验证集用于选模，test 仅供选定权重后的评估；共享母场景及同源派生范围按清单解释。
