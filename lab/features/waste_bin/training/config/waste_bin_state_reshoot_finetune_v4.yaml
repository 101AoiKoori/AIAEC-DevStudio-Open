schema_version: 3
task_id: waste_bin
model_key: waste_bin_state
version: v4
task: detect
data: datasets/exports/waste_bin_state/data.yaml
model: training_packages/waste_bin_state/waste_bin_state_best_Val_Test/best.pt
output_root: runs/waste_bin_state
description: 真实桶主导的四色开闭微调，统一640输入；从原始远程best初始化新优化器，效果待训练验证。
imgsz: 640
epochs: 10
batch: 4
workers: 0
