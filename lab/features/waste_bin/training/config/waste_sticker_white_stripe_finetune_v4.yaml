source_notes:
- 原 Test 已用于发现误检；新挑战沿用留出实拍父组，均按已知来源受控诊断解释。
- 训练正负对照同 split；原始 24 类、全部既有正例标签保留；机器生成与来源证据不冒充人工确认。
- 本轮不使用上一轮微调权重；完整回放旧Train，Reshoot单一采集会话全部Train。
- 学习率降低至0.00002；冻结前10层；warmup_bias_lr=0，防止预热偏置学习率默认0.1破坏已有分类。
- 同一已知Test只用于完成后回归；Val新增24类小尺寸对照；不按Test选择轮次或参数。
