schema_version: 3
task_id: person
model_key: person
version: v4
task: detect
data: datasets/exports/person/data.yaml
model: models/weights/yolo_v8/yolov8n.pt
output_root: runs/person
class_names: [community, noncommunity]

imgsz: 640
epochs: null  # 按本次目标和预算确定训练轮数，也可由 --epochs 指定。
batch: 8
workers: 0
device: '0'
seed: 42
patience: 0
training_policy:
  mode: fixed_validation
  save_period: 5  # 周期检查点的保存频次。
evaluate_after_training: true

optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
amp: false
deterministic: true
augment:
  degrees: 2.0
  translate: 0.03
  scale: 0.05
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.0
  mixup: 0.0
  hsv_h: 0.0
  hsv_s: 0.1
  hsv_v: 0.15
