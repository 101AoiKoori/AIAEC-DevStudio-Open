task: person
status: canonical_entry_sources_connected
allocation: {required: true, engine: datasets/scripts/common/bayesian.py, weights: per_plan_design_assumptions}
goal: 识别正面可辨的社区和非社区人物，电动车直立或倒伏遮挡时仍识别可辨人物。
exclude_as_positive: [侧面, 背面, 不可辨身份]
states: [空场, 单人, 多人, 仅白背, 正背同框, 人物互挡, 无车遮挡, 直立车遮挡, 倒伏车遮挡, 可辨偏航, 明暗, 饱和度]
train_target_images: 3000
source_mix_initial: {direct_real: 0.30, real_background_composite: 0.40, blender_background: 0.30}
source_config: config/source.yaml
sample_output: datasets/samples/person
dataset_output: datasets/exports/person
design_reference: docs/DATASET_DESIGN.md
target_spec:
  facing: frontal_only
  min_height_fraction: 0.28
  minimum_placed_height_fraction: 0.30
  reference_frame: datasets/annotated/site_capture_20261112/sequence_640_v1/full_scene/frame_001201.png
  reference_labelled_heights_px: [117, 120, 122]
  reference_frame_height_px: 360
  back_side: hard_negative
  below_min_scale: filter_in_field_inference
  note: 训练按正面及类别是否可辨标可见框。仅白背且无可辨正面时使用空标签。0.30 按有效画高衡量遮挡前的完整合成立牌，0.28 是现场过滤待标定的尺度参考。
