- id: person_sample_20261116_ground
  sample_path: datasets/samples/person
  image_count: 100
  manifest_sha256: c611c3eb80e27b92c9b1731507918864c95513bbedb558f5ba5355e7ef71ee50
  visual_reference: datasets/annotated/person/sample_feedback/person_sample_20261116_ground/contact.png
  observations:
  - 人物有独立地面足点和偏航，采用 GroundSpace 的近似纵深及透视比例；人车按脚点近远绘制。
  - 楼体附近采用本批画面的局部地面范围，尚不是通用障碍分割。
