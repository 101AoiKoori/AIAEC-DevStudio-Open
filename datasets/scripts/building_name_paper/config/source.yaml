  data_sources:
    - id: ds_generated_text
      kind: generated_text
      path: datasets/scripts/building_name_paper/config/combination_plan.json
      parent_group: null
      roles: [ocr_target]
      split: {primary: shared, status: confirmed}
  blender:
    - id: bl_three_buildings
      kind: blender_scene
      path: datasets/assets/blender/fire/blender_buildings_v13/three_buildings.blend
      role: target_scene
      priority: primary
      split: {primary: shared, status: confirmed, same_source_note: 与 fire 共享母场景}
  captures:
    - id: cap_bnp_val_20261116
      target_split: val
      reason: no_independent_parent_after_label_review
      status: conditional
      object: 楼顶纸条（自定义名称）
      scene: 与现有纸框不同的楼/位置
      views: [frontal, oblique]
      lighting: [normal, dark]
      amount: 30–60 张照片或 2 段短视频
      truth: [paper_box, full_text, building_id]
      save_to: datasets/raw/fire/bnp_capture_20261116_val/
    - id: cap_bnp_test_20261116
      target_split: test
      reason: no_independent_parent_after_label_review
      status: conditional
      object: 楼顶纸条（自定义名称）
      scene: 第三种楼/名称组合
      views: [frontal, oblique]
      lighting: [normal, dark]
      amount: 30–60 张照片或 2 段短视频
      truth: [paper_box, full_text, building_id]
      save_to: datasets/raw/fire/bnp_capture_20261116_test/
  plan_bindings:
