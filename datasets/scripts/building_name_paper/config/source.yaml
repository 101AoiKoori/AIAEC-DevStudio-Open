task: building_name_paper
blender_scene: datasets/assets/blender/fire/blender_buildings_v13/three_buildings.blend
blender_collections: {A: 'A - 开心大厦', B: 'B - 锦绣大厦', C: 'C - 晨光大厦'}
status: configured_inputs_consumed_by_canonical_entry
databases: {media_query: datasets/annotated/media_index/query_cache.sqlite3, blender_registry: datasets/blender_source_registry.sqlite3}
roots: [datasets/raw/fire/archive_assets_legacy, datasets/raw/car_real_capture_20261112, datasets/assets/blender]
records: [datasets/annotated/fire/building_name_paper_v4_car_sequence_review_20261113/manifest.json]
selection: 查询现有数据库和清单，按任务、集合、角色及父来源选取；跨任务背景允许复用。
font: datasets/assets/blender/fire/blender_buildings_v13/NotoSansSC.ttf
background_selection: production_plan_candidates
background_parent_roots: [datasets/raw, Archive/Assets, datasets/assets/blender]
rooftop_sources: datasets/scripts/building_name_paper/config/rooftop_sources.json
combination_plan: datasets/scripts/building_name_paper/config/combination_plan.json
production_plan: datasets/scripts/building_name_paper/config/production_plan.json
blender_plan: datasets/scripts/building_name_paper/config/blender_plan.json
direct_selection: datasets/scripts/building_name_paper/config/direct_selection.json
current_scope:
  direct_detection: two_complete_positive_and_three_complete_negative_records
  original_text_supervision: excluded_when_transcription_unknown
  replacement_text: generated_string_in_existing_paper_box
  excluded_fullframe_composites: previous_1200_plan_has_unknown_background_detection_coverage
direct_manifests:
  - datasets/annotated/site_capture_20261112/fire_name_v4_review/review_manifest.json
  - datasets/annotated/site_capture_20261112/fire_name_v4_review/batch2/review_manifest.json
  - datasets/annotated/fire/v4_real_review_20261112/review_manifest.json
candidate_pool:
  inventory: datasets/annotated/site_capture_20261112/fire_name_v4_review
  reviewed_files: 57
  own_plans:
    - datasets/scripts/building_name_paper/config/rooftop_sources.json
    - datasets/scripts/building_name_paper/config/combination_plan.json
  blocking_review: paper box and text truth per frame; unreadable text stays unknown and a frame without a reviewed box cannot serve as a negative background.
pairing:
  schema_version: 1
  status: draft
  composition_policy:
    target_source: blender_primary
    blender_priority: increased
    blender_share_target: 0.40
    target_components: [generated_text]
    background_components: [three_buildings_scene]
    note: 用户 2026-11-15 确认采用 20/40/40；三楼合景生成纸名，实拍纸框有限
  policy:
    parent_classes: [task_real, background]
    split_unit: parent_group
    train_parent_cap: 0.8
    val_test_mode: reserve_only
    derived_inherits_parent_split: true
    cross_task_duplicates: allowed_with_separate_labels
    same_source_splits: record_and_report
  task_real:
    - id: tr_full_scene_paper
      class: task_real
      kind: parent_video
      paths: [datasets/raw/site_capture_20261112/videos/full_scene.mp4]
      evidence:
        - {manifest: datasets/annotated/site_capture_20261112/fire_name_v4_review/batch2/review_manifest.json}
      capture_session: unknown
      labels: {status: complete, note: 5 帧完整检测记录（2 正 + 3 负），原字串未知不监督}
      roles: [direct_target, composite_target]
      split: {primary: train, status: proposed}
      plan: null
    - id: tr_car_real_paper
      class: task_real
      kind: parent_video
      paths: [datasets/raw/car_real_capture_20261112/V_20261112_152304.mp4]
      evidence:
        - {manifest: datasets/annotated/fire/building_name_paper_v4_car_sequence_review_20261113/manifest.json}
      capture_session: unknown
      labels: {status: partial, note: 6 条记录/3 个手估纸框，纸框与文字待核}
      roles: [direct_target, geometry_reference]
      split: {primary: val, status: proposed}
      plan: null
    - id: tr_review_pool
      class: task_real
      kind: parent_photo_batch
      paths:
        - datasets/annotated/site_capture_20261112/fire_name_v4_review
        - datasets/annotated/fire/v4_real_review_20261112
      evidence:
        - {manifest: datasets/annotated/site_capture_20261112/fire_name_v4_review/review_manifest.json}
        - {manifest: datasets/annotated/site_capture_20261112/fire_name_v4_review/batch2/review_manifest.json}
        - {manifest: datasets/annotated/fire/v4_real_review_20261112/review_manifest.json}
      capture_session: unknown
      labels: {status: candidate, note: 57 个审核文件，按视频分 split 前不得入计划}
      roles: [direct_target, composite_target]
      split: {primary: unassigned, status: proposed}
      plan: null
    - id: tr_bnp_capture_val
      class: task_real
      kind: field_session
      paths: [datasets/raw/fire/bnp_capture_20261116_val]
      evidence:
        - {note: 条件性补采；采后登记原视频/照片、纸框与全文真值}
      capture_session: planned
      capture_id: cap_bnp_val_20261116
      labels: {status: unknown, note: 待采后标注纸框、楼号与全文}
      roles: [direct_target, composite_target]
      split: {primary: val, status: proposed, action: to_capture}
      plan: null
    - id: tr_bnp_capture_test
      class: task_real
      kind: field_session
      paths: [datasets/raw/fire/bnp_capture_20261116_test]
      evidence:
        - {note: 条件性补采；采后登记原视频/照片、纸框与全文真值}
      capture_session: planned
      capture_id: cap_bnp_test_20261116
      labels: {status: unknown, note: 待采后标注纸框、楼号与全文}
      roles: [direct_target, composite_target]
      split: {primary: test, status: proposed, action: to_capture}
      plan: null
  backgrounds:
    - id: bg_building_A
      class: background
      kind: parent_photo_batch
      paths: [datasets/raw/fire/archive_assets_legacy/楼宇/开心大厦/照片]
      evidence:
        - {manifest: datasets/annotated/fire/fire_sticker_v4_arena_handoff_20261113/fire_image_use_manifest_20261114.json}
      review: {state: candidate_empty, method: contact_sheet, accepted_by: null}
      labels: {status: unknown}
      roles: [composite_background]
      split: {primary: train, status: proposed}
      plan: null
    - id: bg_building_B
      class: background
      kind: parent_photo_batch
