      roles: [composite_background]
      split: {primary: test, status: proposed}
      plan: null
    - id: bg_full_scene
      class: background
      kind: parent_video
      paths: [datasets/raw/site_capture_20261112/videos/full_scene.mp4]
      evidence:
        - {manifest: datasets/annotated/site_capture_20261112/fire_name_v4_review/source_gate_manifest.json}
      review: {state: candidate_empty, method: contact_sheet, accepted_by: null, note: 与 tr_full_scene_paper 同一父视频，同属 train}
      labels: {status: unknown}
      roles: [composite_background]
      split: {primary: train, status: proposed}
      plan: null
    - id: bg_site_003
      class: background
      kind: parent_video
      paths: [datasets/raw/site_archive_legacy/场景/三楼与场地视频/三栋楼_垃圾桶与路口_003.mp4]
