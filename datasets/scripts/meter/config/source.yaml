      capture_session: unknown
      labels: {status: complete_visual_pose, note: 7 张 AI 视觉八点；保留 val 父组}
      roles: [direct_target, composite_target]
      split: {primary: val, status: proposed}
      plan: null
    - id: tr_archive_meter
      class: task_real
      kind: parent_photo_batch
      paths:
        - Archive/Assets/working_sources/legacy/meter/照片/小车摄像头实拍_近似平视_仪表和支架_002.png
        - Archive/Assets/working_sources/legacy/meter/照片/手持倾斜近景_表盘_双针_外壳与反光_001.jpg
      evidence:
        - {manifest: datasets/annotated/meter/real_meter_visual_manifest.jsonl}
      capture_session: unknown
      labels: {status: complete_visual_pose, note: 2 张独立原照片；捕获会话未知，作已接触来源诊断 test，不宣称独立现场测试}
      roles: [direct_target, composite_target]
      split: {primary: test, status: proposed}
      plan: null
    - id: tr_meter_capture_val
      class: task_real
      kind: field_session
      paths: [Archive/Assets/captures/meter/capture_20261116_val]
      evidence:
        - {note: 待采；采后登记读数、针位与 8 点真值}
      capture_session: planned
      capture_id: cap_meter_val_20261116
      labels: {status: unknown, note: 待采后标注 8 点、读数、可见性}
      roles: [direct_target, composite_target]
      split: {primary: val, status: proposed, action: to_capture}
      plan: null
    - id: tr_meter_capture_test
      class: task_real
      kind: field_session
      paths: [Archive/Assets/captures/meter/capture_20261116_test]
      evidence:
