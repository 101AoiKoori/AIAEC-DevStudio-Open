real_composite:
  foreground_batch: datasets/samples/meter
  production_plan: datasets/scripts/meter/config/production_plan.json
  count: 36
  selected_background_records:
    - {record_index: 4, id: frame_003601}
    - {record_index: 5, id: frame_009901}
    - {record_index: 6, id: frame_010501}
  lineage_links: []
  status: legacy_fixed_projection_recipe_not_current_sample
  background_usage: candidate_reuse_of_recorded_regression
  background_review: datasets/annotated/meter/v4_real_partial_regression_20261112/review_manifest.json
candidate_pool:
  inventory: datasets/annotated/meter/real_review_candidates_20261110/manifest.json
  samples: 12
  validation_annotations: datasets/annotated/meter/real_video_validation_v1/annotations
  annotation_states: registration_rejected, registration_failed, unreviewed
  blocking_review: legacy candidate inventory only; current complete visual Pose records are consumed from direct_review_manifest.
pairing:
  schema_version: 1
  status: draft
  composition_policy:
    target_source: blender_primary
    blender_priority: increased
    blender_share_target: 0.50
    target_components: [station_model, parametric_needle_pose]
    background_components: [arena_scene, station_scene]
    note: 10/40/50 为历史参考；当前有 54 张完整 AI 视觉八点实拍，按 full_design 的可用来源编批，不复制实拍凑比例。
  policy:
    parent_classes: [task_real, background]
    split_unit: parent_group
    train_parent_cap: 0.8
    val_test_mode: reserve_only
    derived_inherits_parent_split: true
    cross_task_duplicates: allowed_with_separate_labels
    same_source_splits: record_and_report
  task_real:
    - id: tr_car_real_meter
      class: task_real
      kind: parent_video
      paths: [Archive/Assets/captures/car_real_capture_20261112/V_20261112_152304.mp4]
      evidence:
        - {manifest: datasets/annotated/meter/real_meter_visual_manifest.jsonl}
      capture_session: unknown
      labels: {status: complete_visual_pose, note: 44 个序列帧及同父视频 P18 waypoint 共 45 张；物理读数映射未校准}
      roles: [direct_target, composite_target]
      split: {primary: train, status: proposed}
      plan: null
    - id: tr_site_meter
      class: task_real
      kind: parent_photo_batch
      paths: [Archive/Assets/captures/site_capture_20261112/onboard_camera_images]
